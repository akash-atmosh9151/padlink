name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unzip project
        run: |
          Z=$(find . -maxdepth 2 -iname '*.zip' | head -n1)
          echo "Zip: $Z"
          mkdir -p /tmp/proj
          if [ -n "$Z" ]; then unzip -q -o "$Z" -d /tmp/proj; fi
      - name: Build debug APK
        run: |
          F=$(find /tmp/proj . -name settings.gradle -not -path '*/node_modules/*' 2>/dev/null | head -n1)
          if [ -z "$F" ]; then
            echo "No settings.gradle found. Files in repo:"
            find . -not -path './.git/*' | head -50
            exit 1
          fi
          DIR=$(dirname "$F")
          gradle -p "$DIR" assembleDebug --no-daemon
          cp "$DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/PadLink.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: PadLink-apk
          path: PadLink.apk
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest PadLink.apk --title "PadLink APK (latest)" --notes "Install on your phone" --target "${{ github.sha }}"
