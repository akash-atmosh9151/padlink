name: Build-from-zip
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: |
          F=$(find . -name settings.gradle -not -path '*/node_modules/*' | head -n1)
          echo "Found: $F"
          DIR=$(dirname "$F")
          gradle -p "$DIR" assembleDebug --no-daemon
          cp "$DIR/app/build/outputs/apk/debug/app-debug.apk" PadLink.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PadLink-apk
          path: PadLink.apk
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest PadLink.apk --title "PadLink APK (latest)" --notes "Install on your phone" --target "${{ github.sha }}"
