name: Build APK from zip

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack PadLink.zip
        run: |
          set -e
          if [ ! -f PadLink.zip ]; then
            echo "PadLink.zip is not in the repo root yet. Upload it, then run this again."
            exit 1
          fi
          unzip -q PadLink.zip -d unpacked
          SETTINGS=$(find unpacked -name settings.gradle.kts | head -n 1)
          echo "PROJECT=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: ${{ env.PROJECT }}
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PadLink-debug-apk
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
